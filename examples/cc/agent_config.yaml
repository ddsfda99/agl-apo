dataset:
  dataset_path: whitelist_cases.jsonl
  namespace: swebench
  full_set: princeton-nlp/SWE-bench
  split: test

agent:
  tools:
    - Glob
    - Grep
    - Bash
    - Read
    - Edit
    - Write
    - TodoWrite
    - WebFetch
    - ExitPlanMode

  user_prompt: |-  # multiline string
    You are given a code repository in the current directory (/testbed).
    The bug description is:
    {description}
    =================================================
    Your task is to fix the bug with the following steps:

    (1) Explore the repository to understand the project layout and locate the relevant test suite.

    (2) Run the existing test suite to establish a baseline. Record any pre-existing test failures — these are NOT caused by your changes and should be ignored in later comparisons.

    (3) Write test cases that reproduce the bug. Tests must cover:
        - The exact failing scenario from the bug description.
        - All relevant scenarios to make sure the fix is comprehensive.

    (4) Run the reproduction tests. Confirm your new tests FAIL as the bug description predicts, and all old passing tests still pass. Revise if not.

    (5) Locate the root cause in the source code.

    (6) Fix the bug. Do NOT modify any existing test cases. Only modify source code.

    (7) Run the full test suite. Confirm:
        - Your reproduction tests now pass.
        - All existing tests that passed before still pass.
        - If not, revise your source code fix until the above conditions are met.

    (8) Delete the test cases you wrote.

    Reproduction test to add:

    def test_modelform_factory_uses_base_meta_formfield_callback(self):
        """
        modelform_factory() should use the base form's Meta.formfield_callback
        when no explicit callback is provided to the factory.
        """

        def make_required(field, **kwargs):
            formfield = field.formfield(**kwargs)
            if formfield is not None:
                formfield.required = True
            return formfield

        class RequiredStatusForm(forms.ModelForm):
            class Meta:
                model = Article
                fields = ["status"]
                formfield_callback = make_required

        # The base form should have required=True on the 'status' field.
        self.assertTrue(RequiredStatusForm.base_fields["status"].required)

        # FactoryForm should inherit the Meta.formfield_callback and also
        # have required=True on the 'status' field.
        FactoryForm = modelform_factory(Article, form=RequiredStatusForm)
        self.assertTrue(FactoryForm.base_fields["status"].required)

    Please do not commit your edits. We will do it later.

runtime:
  max_step: 100
  sleep_seconds: 6
  workers: 16
  run_method: cli
