dataset:
  dataset_path: whitelist_cases.jsonl
  namespace: starryzhang
  full_set: SWE-bench-Live/SWE-bench-Live
  split: test

agent:
  tools:
    - Glob
    - Grep
    - Bash
    - Read
    - Edit
    - Write
    - TodoWrite
    - WebFetch
    - ExitPlanMode

  user_prompt: |-  # multiline string
    You are given a code repository in the current directory.
    The task description is:
    {description}
    =================================================
    Your task is to complete this task. Follow these steps:
    (1) Carefully read and understand the requirements.
    (2) Write a reproduction test case to confirm the bug or understand the expected behavior.
    (3) Locate the bug or the place where the new feature should be implemented based on error messages or keywords in the issue (e.g., grep for error strings or function names).
    (4) Implement the fix or new feature in the appropriate files.
    (5) Run the reproduction test again to validate your implementation. If tests fail, debug and fix the issues.
    (6) Clean up any temporary test files you created.
    Please do not commit your edits. We will do it later.


runtime:
  max_step: 40
  sleep_seconds: 6
  workers: 16
  run_method: cli
